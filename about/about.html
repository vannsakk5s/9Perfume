<div id="payment-area">
    <canvas id="qrcode"></canvas>
    <a id="bakong-link" href="#" class="btn">Pay in Bakong App</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
const API_BASE = "https://elliott-camping-marco-imaging.trycloudflare.com";

async function startCheckout() {
    // Fetch from your public Cloudflare URL
    const res = await fetch(`${API_BASE}/api/checkout`, { method: 'POST' });
    const data = await res.json();

    // ... (QR and Deeplink logic)

    const interval = setInterval(async () => {
        const statusRes = await fetch(`${API_BASE}/api/check-status/${data.md5}`);
        const statusData = await statusRes.json();

        if (statusData.responseCode === 0) { // Success code from Bakong
            clearInterval(interval);
            alert("ការបង់ប្រាក់ជោគជ័យ!");
            window.location.href = "/orders/success";
        }
    }, 3000);
}

startCheckout();
</script>
